name: Build and test

# Ghidra 12.1.3 requires Java 21.

permissions:
  contents: read

env:
  ghidra-url: https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.1.3_build/ghidra_12.1.3_PUBLIC_20260817.zip
  ghidra-zip-filename: ghidra_12.1.3_PUBLIC_20260817.zip
  ghidra-directory: ghidra_12.1.3_PUBLIC

on:
  push:
    branches: [ master ]
  pull_request:
  release:
    types: [ created ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Download Ghidra release
      run: curl -fL -o "${{ env.ghidra-zip-filename }}" "${{ env.ghidra-url }}"

    - name: Unzip Ghidra
      run: unzip -qq "${{ env.ghidra-zip-filename }}" -d .

    - uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '9.7.1'

    # Fails on any Sleigh error (non-zero exit). The compiled csky_v2.sla is kept so the extension
    # zip ships precompiled.
    - name: Compile Sleigh spec
      run: '"${{ env.ghidra-directory }}/support/sleigh" CSKY/data/languages/csky_v2.slaspec'

    - name: Run Gradle build
      working-directory: ${{ github.workspace }}/CSKY
      run: gradle "-PGHIDRA_INSTALL_DIR=${{ github.workspace }}/${{ env.ghidra-directory }}"

    - name: Upload built extension
      uses: actions/upload-artifact@v4
      with:
        name: extension
        path: CSKY/dist/*.zip

  test:
    runs-on: ubuntu-latest
    needs: build

    steps:
    - uses: actions/checkout@v4

    - name: Download Ghidra release
      run: curl -fL -o "${{ env.ghidra-zip-filename }}" "${{ env.ghidra-url }}"

    - name: Unzip Ghidra
      run: unzip -qq "${{ env.ghidra-zip-filename }}" -d .

    - uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Download built extension
      uses: actions/download-artifact@v4
      with:
        name: extension
        path: extension

    - name: Install extension into Ghidra
      run: unzip -qq extension/*.zip -d "${{ github.workspace }}/${{ env.ghidra-directory }}/Ghidra/Extensions/"

    - name: Install pyghidra
      run: pip install pyghidra==3.1.0

    - name: Run instruction tests
      env:
        GHIDRA_INSTALL_DIR: ${{ github.workspace }}/${{ env.ghidra-directory }}
      run: python tests/run_tests.py

  release:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'release' }}
    needs: [build, test]
    permissions:
      contents: write

    steps:
    - name: Download built extension
      uses: actions/download-artifact@v4
      with:
        name: extension

    - name: Upload extension to release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: gh release upload "${{ github.event.release.tag_name }}" *.zip --repo "${{ github.repository }}" --clobber
